name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (integration)
        run: dotnet test ./BarberBooking.IntegrationTests/BarberBooking.IntegrationTests.csproj -c Release --no-build
        env:
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Install dotnet-format
        run: dotnet tool install -g dotnet-format

      - name: Format check
        run: dotnet format --verify-no-changes

  docker:
    runs-on: ubuntu-latest
    needs: build-test-format

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./BarberBooking.WebApi/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/barberbooking-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/barberbooking-api:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./barberbooking-frontend
          file: ./barberbooking-frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/barberbooking-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/barberbooking-frontend:${{ github.sha }}